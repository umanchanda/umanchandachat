<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Discord Chatbot</title>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #313338;
      color: #dcddde;
      font-family: "gg sans", "Noto Sans", Whitney, "Helvetica Neue", Helvetica, Roboto, Arial, sans-serif;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #2b2d31;
      border-bottom: 1px solid #1e1f22;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    header .avatar {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: #5865f2;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; font-weight: 700; color: #fff;
      flex-shrink: 0;
    }
    header .name { font-weight: 600; font-size: 15px; color: #f2f3f5; }
    header .status { font-size: 12px; color: #b5bac1; }
    header .reset-btn {
      margin-left: auto;
      background: none;
      border: 1px solid #4e5058;
      color: #b5bac1;
      padding: 5px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      transition: background 0.15s;
    }
    header .reset-btn:hover { background: #404249; color: #f2f3f5; }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      scroll-behavior: smooth;
    }

    .message-group { display: flex; flex-direction: column; gap: 2px; }

    .message {
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }
    .message.user { flex-direction: row-reverse; }

    .bubble {
      max-width: 70%;
      padding: 8px 14px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.45;
      word-break: break-word;
    }
    .message.user  .bubble { background: #5865f2; color: #fff; border-bottom-right-radius: 4px; }
    .message.bot   .bubble { background: #2b2d31; color: #dcddde; border-bottom-left-radius: 4px; }

    .typing {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 0;
    }
    .typing .dots { display: flex; gap: 4px; padding: 8px 14px; background: #2b2d31; border-radius: 18px; border-bottom-left-radius: 4px; }
    .typing .dots span {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #b5bac1;
      animation: bounce 1.2s infinite;
    }
    .typing .dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing .dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.6; }
      30%            { transform: translateY(-6px); opacity: 1; }
    }

    #input-area {
      background: #2b2d31;
      border-top: 1px solid #1e1f22;
      padding: 12px 16px;
      display: flex;
      gap: 10px;
      flex-shrink: 0;
    }
    #msg-input {
      flex: 1;
      background: #383a40;
      border: none;
      border-radius: 8px;
      padding: 10px 14px;
      color: #dcddde;
      font-size: 14px;
      resize: none;
      outline: none;
      max-height: 140px;
      min-height: 42px;
    }
    #msg-input::placeholder { color: #6d6f78; }
    #send-btn {
      background: #5865f2;
      border: none;
      border-radius: 8px;
      padding: 0 16px;
      color: #fff;
      font-size: 20px;
      cursor: pointer;
      transition: background 0.15s;
      align-self: flex-end;
      height: 42px;
    }
    #send-btn:hover { background: #4752c4; }
    #send-btn:disabled { background: #3c4043; cursor: default; }
  </style>
</head>
<body>

<header>
  <div class="avatar">B</div>
  <div>
    <div class="name">Discord Bot</div>
    <div class="status">trained on your messages</div>
  </div>
  <button class="reset-btn" id="reset-btn">Clear chat</button>
</header>

<div id="messages"></div>

<div id="input-area">
  <textarea id="msg-input" placeholder="Message the bot…" rows="1" autocomplete="off"></textarea>
  <button id="send-btn" title="Send">&#10148;</button>
</div>

<script>
  const socket = io();
  const messagesEl = document.getElementById("messages");
  const inputEl    = document.getElementById("msg-input");
  const sendBtn    = document.getElementById("send-btn");
  const resetBtn   = document.getElementById("reset-btn");

  let typing = null;

  function scrollToBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function addMessage(text, role) {
    const div = document.createElement("div");
    div.className = `message ${role}`;
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;
    div.appendChild(bubble);
    messagesEl.appendChild(div);
    scrollToBottom();
  }

  function showTyping() {
    if (typing) return;
    typing = document.createElement("div");
    typing.className = "typing";
    typing.innerHTML = `<div class="dots"><span></span><span></span><span></span></div>`;
    messagesEl.appendChild(typing);
    scrollToBottom();
  }

  function hideTyping() {
    if (typing) { typing.remove(); typing = null; }
  }

  function send() {
    const text = inputEl.value.trim();
    if (!text) return;
    addMessage(text, "user");
    socket.emit("message", { text });
    inputEl.value = "";
    inputEl.style.height = "42px";
    sendBtn.disabled = true;
    showTyping();
  }

  socket.on("bot_message", ({ text }) => {
    hideTyping();
    addMessage(text, "bot");
    sendBtn.disabled = false;
    inputEl.focus();
  });

  sendBtn.addEventListener("click", send);

  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });

  inputEl.addEventListener("input", () => {
    inputEl.style.height = "42px";
    inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + "px";
  });

  resetBtn.addEventListener("click", () => {
    socket.emit("reset");
    messagesEl.innerHTML = "";
  });
</script>
</body>
</html>
